        <section class="card">
            <h2>Добавить студента</h2>
            <from action="#">
                <div class="form-group">
                    <label for="first-name">Имя:</label>
                    <input type="text" id="first-name" placeholder="Введите имя">
                </div>

                <div class="form-group">
                    <label for="last-name">Фамилия:</label>
                    <input type="text" id="last-name" placeholder="Введите фамилию">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label for="group">Группа:</label>
                    <input type="text" id="group" placeholder="Введите группу">
                </div>
                 <button type="submit" class="submit-btn">Добавить студента</button>
            </from>
        </section>
