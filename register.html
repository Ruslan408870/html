<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <main>
    <div class="login">
        <h1>Регистрация</h1>
        <p>Создайте новый аккаунт</p>
        <div class="login-form">
            <span>Электронная почта:</span>
            <input type="email" placeholder="Введите электронную почту" id="email">
            <span>Имя пользователя:</span>
            <input type="text" placeholder="Введите имя пользователя" id="username">
            <span>Пароль:</span>
            <input type="password" placeholder="Введите пароль" id="password">
            <span>Подтвердите пароль:</span>
            <input type="password" placeholder="Подтвердите пароль" id="confirm-password">
            <div class="remember">
                <input type="checkbox" id="remember">
                <span>Запомнить меня</span>
                
        </div>
        <button>Зарегистрироваться</button>
        <a href="#">Забыли пароль?</a>
        <a href="index.html">Уже есть аккаунт?</a>
    </div>
 </main>
</body>
</html>
